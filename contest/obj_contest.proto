syntax            = "proto3";
option go_package = "github.com/csuJudge/objectiveProto/objectiveContest";

package oj.contest.knowledge;

service ContestServer {
  // QueryContest 查询作业
  rpc QueryContest(QueryContestReq) returns (QueryContestRsp) {}
  // QueryContestList 查询作业列表
  rpc QueryContestList(QueryContestListReq) returns (QueryContestListRsp) {}
  // AddContest 添加作业
  rpc AddContest(AddContestReq) returns (CommonRsp) {}
  // UpdateContest 更新作业
  rpc UpdateContest(UpdateContestReq) returns (CommonRsp) {}
  // QueryContestPrivilegeInfo 查询作业的权限信息
  rpc QueryContestPrivilegeInfo(QueryContestReq) returns (QueryContestPrivilegeInfoRsp) {}
  // UpdateContestStatus 更新作业状态
  rpc UpdateContestStatus(UpdateContestStatusReq) returns (CommonRsp) {}
  // QueryContestResult 查询作业结果分析(创建人或管理员)
  rpc QueryContestResult(QueryContestResultReq) returns (QueryContestResultRsp) {}
}

message QueryContestPrivilegeInfoRsp {
  string message        = 1;  // 返回信息
  int32 code            = 2;  // 返回码
  string contestProblem = 3;  // 查询作业的问题
  string contestUser    = 4;  // 查询作业的用户
  int32 private         = 5;  // 作业的可见度
  string contestClass   = 6;  // 查询作业的班级
}

message AddContestReq {
  int32 userID        = 1;   // 用户编号
  string startTime    = 2;   // 开始时间
  string endTime      = 3;   // 结束时间
  string title        = 4;   // 标题
  string description  = 5;   // 描述
  int32 private       = 6;   // 是否私有，0公开，1班级访问，2密码访问
  string password     = 7;   // 密码
  string languageMask = 8;   // 限制语言
  string problems     = 9;   // 题目列表
  string people       = 10;  // 人员
  string classID      = 11;  // 班级
  int32 mode = 12; // 模式
  int32 contestType = 13; // 作业类型

}

message UpdateContestReq {
  int32 contestID     = 1;   // 作业编号
  int32 userID        = 2;   // 用户编号
  string startTime    = 3;   // 开始时间
  string endTime      = 4;   // 结束时间
  string title        = 5;   // 标题
  string description  = 6;   // 描述
  int32 private       = 7;   // 是否私有，0公开，1班级访问，2密码访问
  string password     = 8;   // 密码
  string languageMask = 9;   // 限制语言
  string problems     = 10;  // 题目列表
  string people       = 11;  // 人员
  string classID      = 12;  // 班级
  int32 mode = 13; // 模式

}

message UpdateContestStatusReq {
  int32 userID    = 1;  // 用户主键
  int32 contestID = 2;  // 作业主键
  int32 status    = 3;  // 状态
}

message QueryContestListReq {
  int32 page      = 1;  // 页
  int32 limit     = 2;  // 页大小
  int32 userID    = 3;  // 用户主键
  int32 queryType = 4;  // 查询的类型
  string classID = 5; // 班级编号
  string name = 6; // 作业名称
  int32 contestType = 7; // 作业类型
}

message QueryContestListRsp {
  string message            = 1;  // 返回信息
  int32 code                = 2;  // 返回码
  repeated Contest contests = 3;  // 作业集合
  int32 total               = 4;  // 总数
  int32 EndCount = 5; // 已经结束
  int32 notStartCount = 6; // 未开始
  int32 runningCount = 7; // 进行中
}


message QueryContestReq {
  int32 contestID = 1;  // 作业编号
  int32 userID    = 2;  // 用户主键
  string password = 3;  // 密码
  int32 contestType = 4; // 作业类型
}

message QueryContestRsp {
  string message  = 1;  // 返回信息
  int32 code      = 2;  // 返回码
  Contest contest = 3;  // 作业
  bool see        = 4;  // 是否可见
}

message Contest {
  int32 contestID                  = 1;   // 作业编号
  string startTime                 = 2;   // 开始时间
  string endTime                   = 3;   // 结束时间
  string title                     = 4;   // 标题
  string description               = 5;   // 描述
  string languageMask              = 6;   // 限制语言
  string creator                   = 7;   // 创建者
  repeated ContestProblem problems = 8;   // 题目列表
  int32 createdBy                  = 9;   // 创建者编号
  int32 private                    = 10;  // 是否私有
  string password                  = 11;  // 密码
  int32 enable                     = 12;  // 是否结束
  repeated Class classes = 13; // 作业的班级
  int32 participants = 14; // 参与人数
  int32 canUpdate = 15; // 是否能被更新
  int32 mode = 16; // 模式
  int32 contestType = 17; // 作业类型
}

message ContestProblem {
  int32 problemID    = 1;  // 题目编号
  string problemName = 2;  // 题目名称
  int32 isDone       = 3;  // 是否做完
  int32 solved       = 4;  // 解决
  int32 submission   = 5;  // 提交
  int32 difficulty   = 6;  // 难度
  int32 score = 7; // 得分
  float passRate = 8; // 通过率
  string reply = 9; // 学生本人的作答, 未作答为空
}

message Class {
  int32 classID = 1; // 班级编号
  string ClassName = 2; // 班级名称
}

message CommonRsp {
  string message = 1;  // 返回信息
  int32 code     = 2;  // 返回码
}

message QueryContestResultReq {
  int32 contestID = 1;  // 作业编号
  int32 userID    = 2;  // 调用者主键
}

message QueryContestResultRsp {
  string message                    = 1;  // 返回信息
  int32  code                       = 2;  // 返回码
  repeated ContestResultStudent students = 3;  // 成绩榜(按名次升序)
  repeated ContestResultProblem problems = 4;  // 逐题统计
  repeated ContestResultKnowledge knowledge = 5;  // 知识点统计
  int32 submitCount                 = 6;  // 已交作业人数
  int32 avgScore                    = 7;  // 已交学生平均分(四舍五入)
  int32 fullScore                   = 8;  // 试卷满分(各题分值和)
}

message ContestResultStudent {
  int32  userID       = 1;  // 学生主键
  string name         = 2;  // 学生姓名
  int32  score        = 3;  // 总分
  int32  correctCount = 4;  // 答对题数
  int32  submitCount  = 5;  // 作答过的题数
  int32  rank         = 6;  // 名次(同分同名次)
  repeated ContestResultItem items = 7;  // 逐题明细(按作业题目顺序)
}

message ContestResultItem {
  int32  objectiveID  = 1;  // 题目编号
  string reply        = 2;  // 学生作答, 未作答为空
  int32  result       = 3;  // 1 对 / 0 错 / -1 待判定
  int32  score        = 4;  // 本题得分
}

message ContestResultProblem {
  int32  objectiveID   = 1;  // 题目编号
  string name          = 2;  // 题目名称
  int32  score         = 3;  // 本题分值
  int32  submitCount   = 4;  // 作答人数
  int32  correctCount  = 5;  // 答对人数
  float  answerRate    = 6;  // 正确率(0~1)
}

message ContestResultKnowledge {
  string knowledgeID   = 1;  // 知识点编号(题目多知识点时逐一计入)
  int32  submitCount   = 2;  // 关联题目的作答数
  int32  correctCount  = 3;  // 关联题目的答对数
  float  answerRate    = 4;  // 正确率(0~1)
}